[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-romance-runtime"
version = "0.1.0"
description = "Local Qwen runtime host for Qwen Romance Long Output Controller"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "aiosqlite>=0.20",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

